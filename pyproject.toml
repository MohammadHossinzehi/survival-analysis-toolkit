[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survkit"
version = "0.1.0"
description = "Survival analysis from first principles: Kaplan Meier, the log rank family, Cox PH, Weibull, C index and IPCW Brier, NumPy only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]
crosscheck = ["lifelines>=0.27", "pandas"]

[tool.setuptools]
packages = ["survkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
